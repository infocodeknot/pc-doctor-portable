# ==========================================================
# PC Doctor Portable - CI build
#
# On every v* tag push (and manual dispatch):
#   1. Runs the Pester test suite + syntax checks
#   2. Builds Installer\Output\PCDoctorPortable-Setup-<ver>.exe
#   3. Attaches the Setup.exe to the GitHub Release for that
#      tag - which is exactly what the in-app update check
#      downloads ("Download now" button).
#
# The update check in Config.json points at
# https://api.github.com/repos/codeknot/pc-doctor-portable/
# releases/latest - change Config.json if the repo moves.
# ==========================================================

name: Build installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Inno Setup
        shell: cmd
        run: choco install innosetup --no-progress
                   
      - name: GUI self-test (Windows PowerShell)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File App/PCDoctor-GUI.ps1 -SelfTest

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Files = Get-ChildItem -Recurse -Filter *.ps1
          foreach ($F in $Files)
          {
              $Errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $F.FullName, [ref]$null, [ref]$Errors) | Out-Null
              if ($Errors.Count -gt 0)
              {
                  throw "$($F.Name): $($Errors[0].Message)"
              }
          }
          Write-Host "Parsed $($Files.Count) scripts OK"

      - name: Generate app icon (if missing)
        shell: pwsh
        run: pwsh -File Tools/New-AppIcon.ps1

      - name: Build installer
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          pwsh -File Tools/Build-Installer.ps1 -SkipIcon

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCDoctorPortable-Setup
          path: Installer/Output/*.exe
          if-no-files-found: error

      # Optional code signing: store the PFX as a base64 secret
      # (PFX_BASE64) and the password as PFX_PASSWORD. Without a
      # public-CA certificate SmartScreen will warn - see README.
      - name: Sign installer
        if: env.PFX_BASE64 != ''
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          $Bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          $Pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($Pfx, $Bytes)
          pwsh -File Tools/Sign-Installer.ps1 -PfxPath $Pfx -PfxPassword $env:PFX_PASSWORD

      # Attach the Setup.exe to the GitHub Release for this tag,
      # so the in-app "Download now" button gets a direct file.
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Installer/Output/*.exe
          generate_release_notes: true
